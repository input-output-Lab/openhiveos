sonar.projectKey=openhiveos
sonar.projectName=OpenHiveOS
sonar.projectVersion=0.1.0
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/dist/**,**/node_modules/**
sonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,**/.next/**
sonar.sourceEncoding=UTF-8

# Node.js / TypeScript specifics
sonar.javascript.node.maxFileSize=2000
sonar.typescript.typeScriptParserModuleResolution=node

# Quality gates - IO Labs standards
sonar.qualitygate.wait=true
