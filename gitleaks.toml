# OpenHiveOS — gitleaks secret detection configuration
# SEC-19 custom rules, approved by Locksmith (S2-03, 2026-05-20).
#
# Extends gitleaks default ruleset (covers generic high-entropy strings,
# AWS keys, private keys, GitHub tokens, etc.).
#
# Custom rules below cover OpenHiveOS-specific credential formats.
# Any rule firing blocks the CI merge gate (secrets-scan.yml, SEC-15/SEC-19).

title = "OpenHiveOS Secret Detection Rules"

[extend]
# Inherit the full gitleaks built-in ruleset. Custom rules below are additive.
useDefault = true

# ---------------------------------------------------------------------------
# Allowlist — example and fixture files that contain placeholder values.
# These paths are scanned but rule findings are suppressed.
# ---------------------------------------------------------------------------
[allowlist]
description = "Example files and non-secret placeholders"
paths = [
  # .env.example contains DATABASE_URL with literal 'user:password' placeholder
  # and AGENT_TOKEN placeholder — these are documentation, not live credentials.
  '''.env\.example''',
]

# ---------------------------------------------------------------------------
# Custom Rule 1 — OpenHiveOS AGENT_TOKEN
#
# Format: <32-hex-salt>.<64-hex-secret> — 97 chars total.
# Generated by scripts/provision-agent-token.ts.
# A real token committed to the repo would allow any caller to boot the
# MCP server as the provisioned agent.
# ---------------------------------------------------------------------------
[[rules]]
id = "openhiveos-agent-token"
description = "OpenHiveOS AGENT_TOKEN (<32-hex>.<64-hex> format)"
regex = '''\b[0-9a-f]{32}\.[0-9a-f]{64}\b'''
tags = ["openhiveos", "api-token", "sec-19"]

  [rules.allowlist]
  description = "Provisioning script comment blocks and test fixtures"
  regexes = [
    # Placeholder text in comments/docs
    '''<32-hex-salt>\.<64-hex-secret>''',
    '''<run scripts''',
  ]

# ---------------------------------------------------------------------------
# Custom Rule 2 — PostgreSQL DATABASE_URL with embedded credentials
#
# A connection string with a password component committed to the repo would
# expose the database to anyone with repo access.
# ---------------------------------------------------------------------------
[[rules]]
id = "database-url-with-credentials"
description = "PostgreSQL connection string with embedded password"
regex = '''postgres(?:ql)?://[^:@\s"']+:[^@\s"']+@'''
tags = ["database", "credentials", "sec-19"]

# ---------------------------------------------------------------------------
# Custom Rule 3 — Google Gemini / Generative AI API key
#
# Google API keys follow the AIza prefix format. A committed key would allow
# unauthenticated access to the operator's Gemini quota.
# ---------------------------------------------------------------------------
[[rules]]
id = "gemini-api-key"
description = "Google Gemini / Generative AI API key (AIza prefix)"
regex = '''AIza[0-9A-Za-z\-_]{35}'''
tags = ["google", "api-key", "gemini", "sec-19"]
