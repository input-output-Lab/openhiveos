# Pre-commit hook configuration — SEC-15 (local gate)
# Detects secrets before they reach the remote.
#
# Setup (one-time per developer machine):
#   pip install pre-commit
#   pre-commit install
#
# Manual run against all files:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect secrets (gitleaks)
        description: Prevent secrets from being committed
        entry: gitleaks protect --staged --config gitleaks.toml --redact --verbose
        language: golang
        pass_filenames: false
