# CI — Lint & Type-check + Migration validation
# Runs on every push and PR targeting main.
# All jobs must pass before merge is permitted (SEC-14 required status checks).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  migration-validation:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: openhiveos_ci
          POSTGRES_USER: openhiveos_ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: openhiveos_ci
      PGUSER: openhiveos_ci
      PGPASSWORD: ci_password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply migration 001 — OS Primitives
        run: psql -f migrations/001_init.sql

      - name: Apply migration 002 — Coordination Utilities
        run: psql -f migrations/002_coordination_utilities.sql

      - name: Apply migration 003 — Cron Utilities
        run: psql -f migrations/003_crons.sql

      - name: Verify schema — all 9 tables present
        run: |
          MISSING=$(psql -t -A -c "
            SELECT string_agg(t, ', ' ORDER BY t)
            FROM unnest(ARRAY[
              'agents','sops','memories','thoughts','dispositions',
              'projects','tasks','sprints','crons'
            ]) AS t
            WHERE t NOT IN (
              SELECT tablename FROM pg_tables WHERE schemaname = 'public'
            )
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::Migration validation failed. Missing tables: $MISSING"
            exit 1
          fi
          echo "Schema OK — all 9 required tables present"

      - name: Verify deferred FKs — memories and thoughts wired to tasks
        run: |
          MISSING_FKS=$(psql -t -A -c "
            SELECT string_agg(c, ', ' ORDER BY c)
            FROM unnest(ARRAY['fk_memories_task_id','fk_thoughts_task_id']) AS c
            WHERE c NOT IN (
              SELECT constraint_name
              FROM information_schema.table_constraints
              WHERE constraint_type = 'FOREIGN KEY'
            )
          ")
          if [ -n "$MISSING_FKS" ]; then
            echo "::error::FK validation failed. Missing constraints: $MISSING_FKS"
            exit 1
          fi
          echo "FK constraints OK — fk_memories_task_id and fk_thoughts_task_id active"

      - name: Verify cron FKs — crons table wired to projects and agents
        run: |
          MISSING_FKS=$(psql -t -A -c "
            SELECT string_agg(c, ', ' ORDER BY c)
            FROM unnest(ARRAY['crons_project_id_fkey','crons_owner_agent_slug_fkey']) AS c
            WHERE c NOT IN (
              SELECT constraint_name
              FROM information_schema.table_constraints
              WHERE constraint_type = 'FOREIGN KEY'
            )
          ")
          if [ -n "$MISSING_FKS" ]; then
            echo "::error::Cron FK validation failed. Missing constraints: $MISSING_FKS"
            exit 1
          fi
          echo "Cron FK constraints OK — crons_project_id_fkey and crons_owner_agent_slug_fkey active"

      # -----------------------------------------------------------------
      # PRE-A1 gate extension — ARCH-013, ARCH-014, ARCH-015 (D13)
      # Migrations 003–005 added after Sprint 5 scope was established.
      # The openhiveos runtime role must exist before 003_squad_api_role.sql
      # applies — CI uses openhiveos_ci, so create openhiveos as an alias.
      # -----------------------------------------------------------------

      - name: Create openhiveos runtime role for migration compatibility
        run: psql -c "CREATE ROLE openhiveos WITH LOGIN"

      - name: Apply migration 003a — Dashboard agent principal (alphabetically first)
        run: psql -f migrations/003_dashboard_agent.sql

      - name: Apply migration 003b — Squad API reader role
        run: psql -f migrations/003_squad_api_role.sql

      - name: Apply migration 004 — Ethos Seal
        run: psql -f migrations/004_ethos_seal.sql

      - name: Apply migration 005 — LLM Usage Tracking
        run: psql -f migrations/005_llm_usage.sql

      - name: Verify schema — migrations 003-005 tables present
        run: |
          MISSING=$(psql -t -A -c "
            SELECT string_agg(t, ', ' ORDER BY t)
            FROM unnest(ARRAY['ethos_seals','llm_usage']) AS t
            WHERE t NOT IN (
              SELECT tablename FROM pg_tables WHERE schemaname = 'public'
            )
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::Migration 004/005 validation failed. Missing tables: $MISSING"
            exit 1
          fi
          echo "Schema OK — ethos_seals and llm_usage present"

      - name: Verify ARCH-015 replay guard — UNIQUE constraint on session_id + loop_index
        run: |
          MISSING=$(psql -t -A -c "
            SELECT string_agg(c, ', ' ORDER BY c)
            FROM unnest(ARRAY['uq_llm_usage_session_loop']) AS c
            WHERE c NOT IN (
              SELECT conname FROM pg_constraint
              WHERE conrelid = 'llm_usage'::regclass
            )
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::ARCH-015 replay guard missing: $MISSING"
            exit 1
          fi
          echo "Replay guard OK — uq_llm_usage_session_loop present"

      - name: Verify ARCH-015 analytical views — all three squad-api query targets present
        run: |
          MISSING=$(psql -t -A -c "
            SELECT string_agg(v, ', ' ORDER BY v)
            FROM unnest(ARRAY[
              'v_cost_by_agent_month',
              'v_cost_by_project_month',
              'v_cost_by_task'
            ]) AS v
            WHERE v NOT IN (
              SELECT viewname FROM pg_views WHERE schemaname = 'public'
            )
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::Migration 005 incomplete — analytical views missing: $MISSING"
            exit 1
          fi
          echo "Views OK — v_cost_by_agent_month, v_cost_by_project_month, v_cost_by_task present"

      # -----------------------------------------------------------------
      # Migration 006 — Cron worker: next_fire_at (ARCH-011 G1 / S7-05)
      # -----------------------------------------------------------------

      - name: Apply migration 006 — Cron next_fire_at column
        run: psql -f migrations/006_cron_next_fire_at.sql

      - name: Verify migration 006 — next_fire_at column present on crons
        run: |
          COL=$(psql -t -A -c "
            SELECT COUNT(*)
            FROM information_schema.columns
            WHERE table_schema = 'public'
              AND table_name   = 'crons'
              AND column_name  = 'next_fire_at'
          ")
          if [ "$COL" -ne 1 ]; then
            echo "::error::Migration 006 incomplete — crons.next_fire_at column missing"
            exit 1
          fi
          echo "Column OK — crons.next_fire_at present"

      - name: Verify migration 006 — idx_crons_next_fire index present
        run: |
          IDX=$(psql -t -A -c "
            SELECT COUNT(*)
            FROM pg_indexes
            WHERE schemaname = 'public'
              AND tablename  = 'crons'
              AND indexname  = 'idx_crons_next_fire'
          ")
          if [ "$IDX" -ne 1 ]; then
            echo "::error::Migration 006 incomplete — idx_crons_next_fire index missing"
            exit 1
          fi
          echo "Index OK — idx_crons_next_fire present"
