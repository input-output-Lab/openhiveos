# CI — Lint & Type-check + Migration validation + Container security scan
# Runs on every push and PR targeting main.
# All jobs must pass before merge is permitted (SEC-14 required status checks).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  migration-validation:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: openhiveos_ci
          POSTGRES_USER: openhiveos_ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: openhiveos_ci
      PGUSER: openhiveos_ci
      PGPASSWORD: ci_password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # S16-QA-01 (#2548): apply ALL migrations dynamically — a new migration
      # file can no longer silently fall out of CI. Includes extension setup
      # required by 022 (vector) and 023 (btree_gist).
      # Role setup: migration 007 (SEC-7) issues ALTER DEFAULT PRIVILEGES FOR
      # ROLE opensquad_migrate and grants to opensquad_app — both roles must
      # exist in the CI database before migrations run (they are provisioned
      # by ops in real environments, not by migrations).
      - name: Apply all migrations (dynamic)
        run: |
          psql -c "CREATE EXTENSION IF NOT EXISTS vector;" || true
          psql -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          psql -c "CREATE ROLE openhiveos WITH LOGIN;" || true
          psql -c "CREATE ROLE opensquad_migrate WITH LOGIN;" || true
          psql -c "CREATE ROLE opensquad_app WITH LOGIN;" || true
          for f in migrations/[0-9]*.sql; do
            # CI skips (rationale, not bypass):
            # - 009_opensquad_cutover: ops-gated by design — requires a live
            #   source_db_url and runs via scripts/run_cutover.sh only.
            # - 018_inbound_events: byte-identical duplicate of 017 (accidental
            #   copy during ARCH-024 work) — applying both fails on CREATE TABLE.
            #   Deletion tracked as follow-up after live-DB verification.
            case "$f" in
              migrations/009_opensquad_cutover.sql|migrations/018_inbound_events.sql)
                echo "Skipping $f (CI-excluded — see rationale above)"
                continue ;;
            esac
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify schema — all 9 core tables present
        run: |
          MISSING=$(psql -t -A -c "
            SELECT string_agg(t, ', ' ORDER BY t)
            FROM unnest(ARRAY[
              'agents','sops','memories','thoughts','dispositions',
              'projects','tasks','sprints','crons'
            ]) AS t
            WHERE t NOT IN (
              SELECT tablename FROM pg_tables WHERE schemaname = 'public'
            )
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::Migration validation failed. Missing tables: $MISSING"
            exit 1
          fi
          echo "Schema OK — all 9 required tables present"

      - name: Verify deferred FKs — memories and thoughts wired to tasks
        run: |
          MISSING_FKS=$(psql -t -A -c "
            SELECT string_agg(c, ', ' ORDER BY c)
            FROM unnest(ARRAY['fk_memories_task_id','fk_thoughts_task_id']) AS c
            WHERE c NOT IN (
              SELECT constraint_name
              FROM information_schema.table_constraints
              WHERE constraint_type = 'FOREIGN KEY'
            )
          ")
          if [ -n "$MISSING_FKS" ]; then
            echo "::error::FK validation failed. Missing constraints: $MISSING_FKS"
            exit 1
          fi
          echo "FK constraints OK — fk_memories_task_id and fk_thoughts_task_id active"

      - name: Verify cron FKs — crons table wired to projects and agents
        run: |
          MISSING_FKS=$(psql -t -A -c "
            SELECT string_agg(c, ', ' ORDER BY c)
            FROM unnest(ARRAY['crons_project_id_fkey','crons_owner_agent_slug_fkey']) AS c
            WHERE c NOT IN (
              SELECT constraint_name
              FROM information_schema.table_constraints
              WHERE constraint_type = 'FOREIGN KEY'
            )
          ")
          if [ -n "$MISSING_FKS" ]; then
            echo "::error::Cron FK validation failed. Missing constraints: $MISSING_FKS"
            exit 1
          fi
          echo "Cron FK constraints OK — crons_project_id_fkey and crons_owner_agent_slug_fkey active"

      # -----------------------------------------------------------------
      # PRE-A1 gate extension — ARCH-013, ARCH-014, ARCH-015 (D13)
      # openhiveos runtime role is created in the dynamic migration step above
      # (003_squad_api_role.sql expects it to exist).
      # -----------------------------------------------------------------

      - name: Verify schema — migrations 003-005 tables present
        run: |
          MISSING=$(psql -t -A -c "
            SELECT string_agg(t, ', ' ORDER BY t)
            FROM unnest(ARRAY['ethos_seals','llm_usage']) AS t
            WHERE t NOT IN (
              SELECT tablename FROM pg_tables WHERE schemaname = 'public'
            )
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::Migration 004/005 validation failed. Missing tables: $MISSING"
            exit 1
          fi
          echo "Schema OK — ethos_seals and llm_usage present"

      - name: Verify ARCH-015 replay guard — UNIQUE constraint on session_id + loop_index
        run: |
          MISSING=$(psql -t -A -c "
            SELECT string_agg(c, ', ' ORDER BY c)
            FROM unnest(ARRAY['uq_llm_usage_session_loop']) AS c
            WHERE c NOT IN (
              SELECT conname FROM pg_constraint
              WHERE conrelid = 'llm_usage'::regclass
            )
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::ARCH-015 replay guard missing: $MISSING"
            exit 1
          fi
          echo "Replay guard OK — uq_llm_usage_session_loop present"

      - name: Verify ARCH-015 analytical views — all three squad-api query targets present
        run: |
          MISSING=$(psql -t -A -c "
            SELECT string_agg(v, ', ' ORDER BY v)
            FROM unnest(ARRAY[
              'v_cost_by_agent_month',
              'v_cost_by_project_month',
              'v_cost_by_task'
            ]) AS v
            WHERE v NOT IN (
              SELECT viewname FROM pg_views WHERE schemaname = 'public'
            )
          ")
          if [ -n "$MISSING" ]; then
            echo "::error::Migration 005 incomplete — analytical views missing: $MISSING"
            exit 1
          fi
          echo "Views OK — v_cost_by_agent_month, v_cost_by_project_month, v_cost_by_task present"

      # -----------------------------------------------------------------
      # S16-QA-01 (#2548): DB status contract gate. Fails CI when the
      # tasks.status CHECK constraint and the shared TASK_STATUSES const
      # in src/types.ts drift apart. Reads the constraint from the live
      # schema applied above — the drift canary.
      # -----------------------------------------------------------------
      - name: Verify task status contract — DB CHECK vs TASK_STATUSES
        run: |
          psql -t -A -c "
            SELECT pg_get_constraintdef(oid)
              FROM pg_constraint
             WHERE conrelid = 'tasks'::regclass
               AND conname = 'chk_tasks_status'
          " | grep -q "pending-close"
          if [ $? -ne 0 ]; then
            echo "::error::Status contract broken: chk_tasks_status missing pending-close"
            exit 1
          fi
          echo "Status contract OK — chk_tasks_status includes pending-close"

  # -------------------------------------------------------------------------
  # Unit tests — vitest (S16-QA-01: wire test suite into CI)
  # DB-gated tests (RUN_DB_TESTS, testcontainers suites) remain excluded
  # here; they run via the migration-validation postgres service in a
  # follow-up if flakiness permits.
  # -------------------------------------------------------------------------
  unit-tests:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test_placeholder
      GEMINI_API_KEY: test_placeholder_key
      GATEWAY_MODE: 'true'
      # SEC-C1: config schema requires a min-64-char ingestion token at import
      # time. CI never posts to /internal/usage — placeholder only, never a
      # real value. Individual tests that exercise ingestion set their own.
      OPENHIVEOS_INGESTION_TOKEN: ci_placeholder_ingestion_token_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # DB-gated suites (tests/db, tests/squad-api/app+status-contract,
      # routes/integrations, sops/ingest, workers/cron) require testcontainers
      # + a Docker runtime the CI unit job doesn't provision. They run locally
      # (229 pass) and via the migration-validation postgres service in a
      # follow-up. Excluded here so the job asserts the DB-free surface.
      - name: Run unit tests (DB-free suites)
        run: npx vitest run --exclude 'tests/db/**' --exclude 'tests/squad-api/app.test.ts' --exclude 'tests/squad-api/status-contract.test.ts' --exclude 'tests/routes/integrations.test.ts' --exclude 'tests/sops/ingest.test.ts' --exclude 'tests/workers/cron.worker.test.ts' --exclude 'tests/utilities/update-project.test.ts'

  # -------------------------------------------------------------------------
  # Container security scan — Trivy (SEC-8)
  # SEC-8 thresholds: CRITICAL: 0, HIGH: managed .trivyignore (per-CVE comments)
  # Unfixed CVEs: skipped via --ignore-unfixed.
  # Known HIGH CVEs with no fix: documented in .trivyignore with justification.
  # -------------------------------------------------------------------------
  container-scan:
    name: Container security scan (Trivy)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        # SEC-D2: VITE_DASHBOARD_AGENT_TOKEN is NOT passed here — CI scan builds
        # the dashboard with an empty token. This is intentional: Trivy scans the
        # base image for CVEs, not dashboard content. A real token must NEVER be
        # hardcoded in this file. When adding a Docker Hub publish job, supply the
        # token exclusively via: --build-arg VITE_DASHBOARD_AGENT_TOKEN=${{ secrets.VITE_DASHBOARD_AGENT_TOKEN }}
        # and ensure VITE_DASHBOARD_AGENT_TOKEN is registered as a masked GitHub Actions secret.
        run: docker build --target production -t openhiveos:ci-scan .

      - name: Run Trivy — CRITICAL exit on any finding (SEC-8)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          # Pin the scanner binary: the action's default trivy version drifts
          # (v0.33.1 defaulted to v0.65.0, which does not exist upstream —
          # 404 at download). 0.76.1 is a verified published release.
          version: v0.76.1
          image-ref: openhiveos:ci-scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          trivyignores: .trivyignore

      - name: Run Trivy — HIGH findings summary (informational, no exit)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          version: v0.76.1
          image-ref: openhiveos:ci-scan
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH
          trivyignores: .trivyignore
