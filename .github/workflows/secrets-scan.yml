# SEC-15 — Secrets Scanning Gate
# Blocks merge if any secret, credential, or token is detected.
# Runs on every push to main and every pull request targeting main.
# Uses gitleaks CLI (Apache 2.0) — no license required.

name: Secrets Scan (SEC-15)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets
        run: |
          gitleaks detect \
            --source . \
            --config gitleaks.toml \
            --log-opts "origin/main..HEAD" \
            --redact \
            --exit-code 1 \
            --verbose
        # --config loads OpenHiveOS custom rules (SEC-19) on top of gitleaks defaults.
        # Exit code 1 = secrets found → workflow fails → merge blocked.
