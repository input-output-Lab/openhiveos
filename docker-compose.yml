# OpenHiveOS — Docker runtime (Homebrew Postgres)
#
# Runs squad-api and mcp-gateway as Docker containers.
# PostgreSQL runs on the host via Homebrew — NOT in Docker.
# Containers reach it via host.docker.internal:5432 (macOS Docker Desktop).
#
# Pre-requisites:
#   - dist/ and packages/mcp-gateway/dist/ must be built:
#       npm run build
#       (cd packages/mcp-gateway && npm run build)
#   - ethos.seal.json must exist at the project root
#
# Start:
#   docker compose up -d
#
# Stop and tear down PM2/background processes first — ports 3005 and 3008
# must be free before starting containers.

name: openhiveos

services:

  # ---------------------------------------------------------------------------
  # Squad API — HTTP server for the operator dashboard (ARCH-012 A4)
  #
  # Serves the compiled dashboard SPA on / and REST endpoints on /api/*.
  # Bound to 127.0.0.1 on the host — never expose 0.0.0.0 without a TLS
  # reverse proxy in front (SEC-A3).
  #
  # DATABASE_URL: uses host.docker.internal so the container can reach the
  # Homebrew Postgres on the macOS host (Docker Desktop macOS requirement).
  # ---------------------------------------------------------------------------
  squad-api:
    build:
      context: .
      dockerfile: Dockerfile
      # prebuilt-runtime: skips TypeScript compile — dist/ is bind-mounted
      # from the host at runtime. Run `npm run build` on the host before
      # starting this service to ensure dist/ is current.
      target: prebuilt-runtime
    command: ["node", "dist/squad-api/index.js"]
    restart: unless-stopped
    extra_hosts:
      # macOS Docker Desktop: reach host Postgres via this alias
      - "host.docker.internal:host-gateway"
    environment:
      # Points to Homebrew Postgres on the macOS host (not a Docker container).
      DATABASE_URL: postgresql://openhiveos:${POSTGRES_PASSWORD}@host.docker.internal:5432/openhiveos # gitleaks:allow
      SQUAD_API_PORT: ${SQUAD_API_PORT:-3005}
      # Must be 0.0.0.0 inside the container so Compose health checks and
      # internal routing work. Host binding below keeps external exposure to
      # 127.0.0.1 only (SEC-A3: squad-api binds loopback on the host).
      SQUAD_API_HOST: "0.0.0.0"
      OPENHIVEOS_INGESTION_TOKEN: ${OPENHIVEOS_INGESTION_TOKEN}
    ports:
      # PRE-2 GATE: port 3005 confirmed free on production host.
      # Reverse proxy entry required before exposing publicly.
      - "127.0.0.1:${SQUAD_API_PORT:-3005}:${SQUAD_API_PORT:-3005}"
    volumes:
      # Pre-compiled host dist/ — avoids a TypeScript build step inside Docker.
      # Re-run `npm run build` on the host whenever src/ changes.
      - ./dist:/app/dist:ro
      - ./squad.manifest.json:/app/squad.manifest.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3005/health 2>/dev/null | grep -q 'status'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MCP Gateway — StreamableHTTP + SSE bridge (ARCH-016)
  #
  # Exposes:
  #   POST /mcp  — StreamableHTTP (MCP SDK 1.x) — VS Code / Copilot clients
  #   GET  /sse  — Legacy SSE (MCP SDK 0.x)     — Bridge / openBridge
  #
  # The MCP server (dist/index.js) is spawned as a subprocess by the gateway
  # via StdioClientTransport — it does NOT need its own Compose service.
  # dist/ is bind-mounted at /mcp-server so the subprocess node binary path
  # resolves to /mcp-server/index.js.
  #
  # Port assignments (locked):
  #   3008 → gateway HTTP (/mcp + /sse)        — MCP_GATEWAY_PORT
  #   3009 → MCP subprocess health endpoint    — HEALTH_PORT (injected into child)
  #
  # SEC-D1/D2: MCP_GATEWAY_TOKEN auth — timingSafeEqual, 64 hex chars min
  # SEC-D3: ?token= redacted from logs (gateway application layer)
  # SEC-D4: host port bound to 127.0.0.1 only — never 0.0.0.0
  # SEC-D5: MCP_GATEWAY_TOKEN registered in gitleaks.toml
  # SEC-D6: one AGENT_TOKEN = one agent identity
  # SEC-D8: gateway blocks connections until subprocess listTools() succeeds
  # SEC-D9: rate limit 10 SSE connections/min (express-rate-limit in gateway)
  # SEC-D10: env vars scoped — OPENHIVEOS_INGESTION_TOKEN is NOT included
  # ---------------------------------------------------------------------------
  openhiveos-mcp-gateway:
    build:
      context: .
      dockerfile: packages/mcp-gateway/Dockerfile
      args:
        MCP_VERSION: "0.2.0"
    restart: unless-stopped
    extra_hosts:
      # macOS Docker Desktop: reach host Postgres via this alias
      - "host.docker.internal:host-gateway"
    environment:
      # Points to Homebrew Postgres on the macOS host (not a Docker container).
      DATABASE_URL: postgresql://openhiveos:${POSTGRES_PASSWORD}@host.docker.internal:5432/openhiveos # gitleaks:allow
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # ARCH-021: AGENT_TOKEN is NOT set here. The gateway resolves agent identity
      # per-request from the Bearer token via DB lookup and injects __agentSlug
      # into each callTool() call. The subprocess runs in GATEWAY_MODE.
      GATEWAY_MODE: "true"
      # SEC-D1/D2: authentication token for legacy /sse endpoint (Bridge connections).
      # /mcp now uses per-agent Bearer tokens resolved against the agents table.
      MCP_GATEWAY_TOKEN: ${MCP_GATEWAY_TOKEN}
      # Gateway HTTP port — container listens on this port and host maps it 1:1
      MCP_GATEWAY_PORT: ${MCP_GATEWAY_PORT:-3008}
      # HEALTH_PORT is injected into the spawned MCP subprocess env (gateway.ts).
      # Must differ from MCP_GATEWAY_PORT to avoid listener collision.
      HEALTH_PORT: ${HEALTH_PORT:-3009}
      # Absolute path to MCP server binary inside the container (bind-mounted below).
      # /mcp-app mirrors the project root layout so node module resolution works:
      #   /mcp-app/dist/index.js  ← the spawned binary
      #   /mcp-app/node_modules/  ← host deps (bind-mounted from ./node_modules)
      MCP_BINARY_PATH: /mcp-app/dist/index.js
      # ARCH-013: Ethos Seal verification on MCP server boot
      ETHOS_SEAL_PATH: /ethos-seal/ethos.seal.json
      # SEC-D4: 0.0.0.0 inside the container — Docker host port mapping
      # (127.0.0.1:3008->3008) enforces loopback at the network layer.
      GATEWAY_BIND: "0.0.0.0"
    ports:
      # SEC-D4: 127.0.0.1 loopback binding — never 0.0.0.0.
      # VS Code MCP client connects via http://127.0.0.1:3008/mcp
      - "127.0.0.1:${MCP_GATEWAY_PORT:-3008}:${MCP_GATEWAY_PORT:-3008}"
    volumes:
      # MCP server binary — bind-mount host dist/ at /mcp-app/dist.
      # Rebuild with `npm run build` on the host when source changes.
      - ./dist:/mcp-app/dist:ro
      # Host node_modules — the spawned MCP subprocess resolves @modelcontextprotocol/sdk
      # and other deps from here. Must mirror the host project layout.
      - ./node_modules:/mcp-app/node_modules:ro
      # Agent roster
      - ./squad.manifest.json:/mcp-app/squad.manifest.json:ro
      # Agent roster for gateway process (it reads it too)
      - ./squad.manifest.json:/app/squad.manifest.json:ro
      # Ethos Seal — read-only. ethos.seal.json lives at the project root.
      - ./ethos.seal.json:/ethos-seal/ethos.seal.json:ro
    healthcheck:
      # Two-layer check: /health returns 200 only after subprocess listTools() succeeds.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${MCP_GATEWAY_PORT:-3008}/health 2>/dev/null | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MCP server — stdio transport for VS Code / Copilot (ARCH-008)
  #
  # Not on the normal `docker compose up` path — VS Code spawns it on demand:
  #   docker compose run --rm -i mcp
  #
  # Uses the prebuilt-runtime stage (bind-mounted host dist/).
  # Connects to Homebrew Postgres on the host via host.docker.internal.
  # Ethos Seal bind-mounted read-only from the project root.
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: prebuilt-runtime
    command: ["node", "dist/index.js"]
    restart: "no"
    stdin_open: true
    tty: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://openhiveos:${POSTGRES_PASSWORD}@host.docker.internal:5432/openhiveos # gitleaks:allow
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AGENT_TOKEN: ${AGENT_TOKEN}
      ETHOS_SEAL_PATH: /ethos-seal/ethos.seal.json
      HEALTH_PORT: ${HEALTH_PORT:-3009}
    volumes:
      - ./dist:/app/dist:ro
      - ./node_modules:/app/node_modules:ro
      - ./squad.manifest.json:/app/squad.manifest.json:ro
      - ./seeds:/app/seeds:ro
      - ./ethos.seal.json:/ethos-seal/ethos.seal.json:ro

  # ---------------------------------------------------------------------------
  # Ethos Seal init — Stage 1 of canonical operator onboarding (ARCH-013 B6)
  #
  # Not on the normal `docker compose up` path (profiles: ["init"]).
  # Invocation: docker compose --profile init run --rm one-init
  # ---------------------------------------------------------------------------
  one-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["node", "dist/scripts/one-init.js"]
    profiles: ["init"]
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://openhiveos:${POSTGRES_PASSWORD}@host.docker.internal:5432/openhiveos # gitleaks:allow
      ETHOS_SEAL_SECRET: ${ETHOS_SEAL_SECRET}
      ETHOS_SEAL_PATH: /ethos-seal/ethos.seal.json
    volumes:
      - ${ETHOS_SEAL_DIR:-./ethos-seal}:/ethos-seal:rw

  # ---------------------------------------------------------------------------
  # Agent provision — Stage 2 of canonical operator onboarding (ARCH-014 C5)
  #
  # Not on the normal `docker compose up` path (profiles: ["init"]).
  # Invocation: docker compose --profile init run --rm provision
  # ---------------------------------------------------------------------------
  provision:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["node", "dist/scripts/provision-all-agents.js", "--all", "--write-env", "/provision/.env.tokens"]
    profiles: ["init"]
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://openhiveos:${POSTGRES_PASSWORD}@host.docker.internal:5432/openhiveos # gitleaks:allow
      ETHOS_SEAL_PATH: /ethos-seal/ethos.seal.json
      PROVISION_ENV_DIR: /provision
    volumes:
      - ./ethos.seal.json:/ethos-seal/ethos.seal.json:ro
      - ${PROVISION_ENV_DIR:-./provision}:/provision:rw
