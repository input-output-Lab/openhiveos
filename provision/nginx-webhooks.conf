# =============================================================================
# OpenHiveOS — nginx location block for inbound webhook endpoints
# ARCH-024 — Locksmith condition C2 (separate prefix) + C5 (body size limit)
#
# Apply to: /etc/nginx/sites-available/openhiveos (or equivalent)
# After adding: nginx -t && nginx -s reload
#
# This block must be placed INSIDE your server {} block.
# It routes inbound provider webhooks to squad-api without hitting the
# /api/* auth stack — ClickUp cannot present an agent bearer token.
# =============================================================================

# --- ClickUp inbound webhook ---
# Locksmith C2: mounted at /webhooks/clickup, NOT under /api
# Locksmith C5: client_max_body_size 256k — ClickUp payloads are small;
#               this prevents DoS via oversized POST bodies
location /webhooks/clickup {
    client_max_body_size 256k;
    proxy_pass         http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Forward the ClickUp HMAC signature header for verification in squad-api
    proxy_set_header   X-Signature       $http_x_signature;
}

