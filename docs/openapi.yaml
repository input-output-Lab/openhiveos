openapi: "3.1.0"

info:
  title: OpenHiveOS Squad API
  version: "0.2.0"
  description: |
    HTTP API for the OpenHiveOS operator dashboard and LLM usage ingestion.

    There are two distinct authentication surfaces:

    - **Dashboard routes** (`/api/*`): Bearer token issued to a registered agent
      via `provision-agent-token.ts`. Identity is resolved server-side from the
      token hash — the caller cannot supply or override their agent slug.

    - **Ingestion route** (`/internal/usage`): Shared secret
      (`OPENHIVEOS_INGESTION_TOKEN` — 64-char lowercase hex, 32 bytes CSPRNG).
      Used exclusively by Bridge to POST LLM usage records.

    Source authority: ARCH-012 (dashboard), ARCH-013 (ethos-seal), ARCH-015 (usage ingestion).

servers:
  - url: "http://localhost:3005"
    description: Local development (squad-api default port)

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    AgentBearer:
      type: http
      scheme: bearer
      description: |
        Per-agent bearer token in the format `<32-hex-salt>.<64-hex-secret>`.
        Issued by `npx tsx src/scripts/provision-agent-token.ts <slug>`.
        Identity is resolved server-side — the caller cannot override their slug.

    IngestionBearer:
      type: http
      scheme: bearer
      description: |
        Shared secret for Bridge → squad-api ingestion.
        Value of `OPENHIVEOS_INGESTION_TOKEN` — 64 lowercase hex chars (32 bytes CSPRNG).
        Generate: `node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"`
        See: docs/08-agent-onboarding.md §6 for rotation procedure (SEC-C10).

  # ---------------------------------------------------------------------------
  # Reusable schemas
  # ---------------------------------------------------------------------------
  schemas:
    # --- Ethos Seal -----------------------------------------------------------
    EthosSealMeta:
      type: object
      required: [version, signature, activated_at, activated_by]
      properties:
        version:
          type: integer
          description: Monotonically increasing revision counter. Starts at 1.
          example: 3
        signature:
          type: string
          description: HMAC-SHA256(canonical_payload_json, ETHOS_SEAL_SECRET), hex-encoded.
          example: "a1b2c3..."
        activated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when this seal version was activated.
        activated_by:
          type: string
          enum: ["cli:init", "cli:revise", "cli:recovery"]
          description: Provisioning context for this seal version.

    EthosSealFull:
      allOf:
        - $ref: "#/components/schemas/EthosSealMeta"
        - type: object
          properties:
            payload:
              type: object
              description: Full structured seal content (squad name, agents, Five Laws, seat definitions). Only present when ?include=payload is requested.

    EthosSealResponse:
      type: object
      required: [active, history]
      properties:
        active:
          $ref: "#/components/schemas/EthosSealMeta"
        payload:
          $ref: "#/components/schemas/EthosSealFull/allOf/1/properties/payload"
          description: Present only when ?include=payload is requested.
        history:
          type: array
          description: Last 10 deactivated seal versions, ordered by version DESC. Metadata only — no payload.
          items:
            $ref: "#/components/schemas/EthosSealMeta"

    # --- LLM Usage -----------------------------------------------------------
    AgentMonthRow:
      type: object
      required: [agent_slug, month, session_count, prompt_tokens, completion_tokens, cost_usd]
      properties:
        agent_slug:
          type: string
          description: Agent identifier (matches agents.slug).
          example: "murphy"
        month:
          type: string
          format: date-time
          description: First day of the calendar month (UTC, date_trunc output).
        session_count:
          type: string
          description: Number of distinct sessions in this month. Returned as string by PostgreSQL COUNT.
          example: "42"
        prompt_tokens:
          type: string
          description: Total prompt tokens consumed in this month.
          example: "1250000"
        completion_tokens:
          type: string
          description: Total completion tokens consumed in this month.
          example: "84000"
        cost_usd:
          type: string
          description: Total cost in USD for this month. Returned as string by PostgreSQL SUM.
          example: "12.45"

    AgentUsageResponse:
      type: object
      required: [months, data]
      properties:
        months:
          type: integer
          description: Number of months included in the response window.
          minimum: 1
          maximum: 24
          example: 6
        data:
          type: array
          items:
            $ref: "#/components/schemas/AgentMonthRow"

    AgentDetailResponse:
      type: object
      required: [agent_slug, data]
      properties:
        agent_slug:
          type: string
          example: "murphy"
        data:
          type: array
          description: Monthly rows for the agent, ordered by month DESC. Always 12-month window.
          items:
            $ref: "#/components/schemas/AgentMonthRow"

    TaskCostRow:
      type: object
      required: [task_id, task_title, project_name, request_count, total_tokens, cost_usd]
      properties:
        task_id:
          type: string
          description: Numeric task ID as string (PostgreSQL return type).
          example: "1234"
        task_title:
          type: string
          example: "ARCH-015 A6 — wire ingestion route"
        project_name:
          type: string
          example: "openhiveos"
        assigned_agent:
          type: string
          nullable: true
          example: "murphy"
        request_count:
          type: string
          description: Total number of LLM requests attributed to this task.
          example: "87"
        total_tokens:
          type: string
          description: Prompt + completion tokens combined.
          example: "340000"
        cost_usd:
          type: string
          example: "4.12"
        first_activity:
          type: string
          format: date-time
          nullable: true
        last_activity:
          type: string
          format: date-time
          nullable: true

    # --- Error ---------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: "No usage data found for agent \"murphy\""

    # --- Health probe --------------------------------------------------------
    HealthResponse:
      type: object
      required: [status, service, db, schema]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Top-level health signal. `ok` when all checks pass; `degraded` when any check fails.
        service:
          type: string
          example: squad-api
          description: Identifies the responding process.
        db:
          type: string
          enum: [connected, error]
          description: PostgreSQL pool connectivity status.
        schema:
          type: string
          enum: [ok, degraded]
          description: Schema integrity status. `degraded` when one or more required tables are absent.
        missing_tables:
          type: array
          items:
            type: string
          description: Present only when `schema` is `degraded`. Lists the table names that are absent.
          example: [tasks, projects]
        error:
          type: string
          description: Present only when `db` is `error`. Raw error message from the pool — never exposes credentials.
          example: "Connection refused"

    # --- Agent roster --------------------------------------------------------
    AgentRow:
      type: object
      required: [slug, display_name, active, updated_at, last_used_at, active_task_count]
      properties:
        slug:
          type: string
          example: murphy
        display_name:
          type: string
          example: Murphy
        active:
          type: boolean
        updated_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        active_task_count:
          type: integer
          minimum: 0
          description: Count of tasks in todo/wip/review/rework status assigned to this agent. Never null.
          example: 3

    AgentManifest:
      type: object
      nullable: true
      description: |
        Static identity data loaded from `squad.manifest.json` at server startup (SEC-C5).
        Null if the agent slug is not present in the manifest.

        **OQ-2 / ARCH-020:** `skills`, `owns`, and `works_with` were added in manifest v1.1.0.
        These are identity-layer fields — they describe capability and structural relationships,
        not runtime state. Stored in the manifest (not the DB) because they require no independent
        queryability at v1. Migration path documented in ARCH-020.
      required: [role, skills, owns, works_with]
      properties:
        role:
          type: string
          description: The agent's seat title on the Accountability Chart.
          example: Senior Backend Developer
        skills:
          type: array
          items:
            type: string
          description: Skill slugs the agent is authorised to execute (matches IO Labs skill library names).
          example: ["api-design", "db-design", "code-review"]
        owns:
          type: array
          items:
            type: string
          description: Domains and outcomes this agent is the decision authority for.
          example: ["feature-delivery", "api-contracts", "test-coverage"]
        works_with:
          type: array
          items:
            type: string
          description: Agent slugs this agent routinely collaborates with.
          example: ["silas", "rocket", "scout"]

    AgentDetail:
      allOf:
        - $ref: "#/components/schemas/AgentRow"
        - type: object
          required: [manifest]
          properties:
            manifest:
              $ref: "#/components/schemas/AgentManifest"

    # --- SOPs ----------------------------------------------------------------
    SopRow:
      type: object
      required: [id, source_path, display_name, category, agent, preview, created_at, updated_at]
      properties:
        id:
          type: integer
          description: Primary key.
        source_path:
          type: string
          nullable: true
          description: |
            Absolute path to the source `.md` file on disk. Null for SOPs
            ingested without a file reference.
        display_name:
          type: string
          description: |
            Human-readable label derived server-side from `source_path` basename
            (`.md` extension stripped). Empty string when `source_path` is null.
          example: "git-deployment-workflow"
        category:
          type: string
          enum: [Coding, DevOps, QA, Architecture, Documentation, Decision]
          description: SOP category — one of the VALID_CATEGORIES allowlist (SEC-C7).
        agent:
          type: string
          nullable: true
          description: Agent slug the SOP is scoped to. Null for org-wide SOPs.
        preview:
          type: string
          maxLength: 200
          description: First 200 characters of the `instruction` field. Full text not exposed in list endpoint.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SopsResponse:
      type: object
      required: [sops, pagination]
      properties:
        sops:
          type: array
          items:
            $ref: "#/components/schemas/SopRow"
        pagination:
          type: object
          required: [limit, offset, has_more]
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
            offset:
              type: integer
              minimum: 0
            has_more:
              type: boolean
              description: True when a (limit+1)th row exists beyond this page.

    TaskRow:
      type: object
      required:
        - id
        - project_id
        - project_slug
        - title
        - status
        - assignee_agent_slug
        - github_pr_url
        - notes
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: Task primary key.
        project_id:
          type: integer
          description: FK to projects.id.
        project_slug:
          type: string
          nullable: true
          description: Denormalized from LEFT JOIN projects. Null on FK orphan (not possible by schema constraints, included for type safety).
        title:
          type: string
          description: Short task title.
        description:
          type: string
          nullable: true
          description: Extended description. Null when not provided.
        status:
          type: string
          enum: [todo, wip, review, done, rework]
          description: Task status — one of VALID_TASK_STATUSES (SEC-C3).
        assignee_agent_slug:
          type: string
          nullable: true
          description: Agent slug. Null when unassigned.
        github_pr_url:
          type: string
          nullable: true
          description: GitHub PR URL if linked. Null otherwise.
        notes:
          type: string
          nullable: true
          description: Free-form notes. Null when not provided.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TasksResponse:
      type: object
      required: [tasks, pagination]
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskRow"
        pagination:
          type: object
          required: [limit, offset, has_more]
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
            offset:
              type: integer
              minimum: 0
            has_more:
              type: boolean
              description: True when a (limit+1)th row exists beyond this page.

    ThoughtRow:
      type: object
      required:
        - id
        - agent_slug
        - session_id
        - task_id
        - thought
        - thought_type
        - confidence
        - must_surface
        - auto_persist_candidate
        - ratified_by
        - ratified_at
        - auto_persisted
        - counter_thought
        - metadata
        - created_at
      description: |
        A single thought record. The following columns are intentionally excluded
        (SEC-B1, SEC-B3): `embedding`, `raw_behavior`, `expressed_behavior`,
        `disposition_snapshot`.
      properties:
        id:
          type: integer
        agent_slug:
          type: string
          description: The agent that recorded this thought.
        session_id:
          type: string
          nullable: true
          description: Session identifier. Null when thought was recorded outside a tracked session.
        task_id:
          type: integer
          nullable: true
          description: Soft reference to a task. Not a FK — may reference tasks in any tier.
        thought:
          type: string
          description: The thought content.
        thought_type:
          type: string
          enum: [analysis, concern, decision, hypothesis, realization, pushback]
          description: Thought classification (SEC-C3 allowlist).
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          nullable: true
        must_surface:
          type: boolean
          description: True when the thought requires human review.
        auto_persist_candidate:
          type: boolean
          description: True when the thought is a candidate for automatic persistence to long-term memory.
        ratified_by:
          type: string
          nullable: true
          description: Slug of the agent (or operator) that ratified this thought. Null when unratified.
        ratified_at:
          type: string
          format: date-time
          nullable: true
          description: ISO 8601 timestamp of ratification. Null when unratified.
        auto_persisted:
          type: boolean
          description: True when the thought has been automatically written to long-term memory.
        counter_thought:
          nullable: true
          description: Structured counter-argument JSONB, if any. Shape is agent-defined.
        metadata:
          type: object
          description: Operational metadata JSONB. Shape is agent-defined.
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    ThoughtsResponse:
      type: object
      required: [thoughts, pagination]
      properties:
        thoughts:
          type: array
          items:
            $ref: "#/components/schemas/ThoughtRow"
        pagination:
          type: object
          required: [limit, offset, has_more]
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
            offset:
              type: integer
              minimum: 0
            has_more:
              type: boolean
              description: True when a (limit+1)th row exists beyond this page.

    # --- Ingestion payload ---------------------------------------------------
    UsageIngestionPayload:
      type: object
      required:
        - session_id
        - loop_index
        - agent_slug
        - model
        - provider
        - prompt_tokens
        - completion_tokens
        - cost_usd
      additionalProperties: false
      description: |
        LLM usage record posted by Bridge. Unknown fields are rejected with 400 (SEC-C4 strict mode).
      properties:
        session_id:
          type: string
          pattern: "^[a-z][a-z0-9_-]*:[^:]+:\\d{13}$"
          description: |
            Composite identifier in the format `<agent-slug>:<context-id>:<unix-ms>`.
            Must match the opensquad session_id format exactly (SEC-C5).
          example: "murphy:abc123:1716393600000"
        loop_index:
          type: integer
          minimum: 0
          description: |
            Zero-based index of this request within the session. Required — not optional.
            Combined with session_id in a UNIQUE constraint to prevent replay injection (SEC-C6).
          example: 0
        agent_slug:
          type: string
          minLength: 1
          maxLength: 64
          example: "murphy"
        model:
          type: string
          minLength: 1
          maxLength: 256
          example: "gemini-2.5-pro"
        provider:
          type: string
          minLength: 1
          maxLength: 128
          example: "google"
        prompt_tokens:
          type: integer
          minimum: 0
          example: 12500
        completion_tokens:
          type: integer
          minimum: 0
          example: 840
        cost_usd:
          type: number
          minimum: 0
          description: |
            Cost in USD supplied by Bridge. Required — server does not compute pricing (SEC-C9).
          example: 0.0138
        cache_read_tokens:
          type: integer
          minimum: 0
          description: Optional. Prompt cache read tokens (provider-specific).
          example: 4000
        cache_creation_tokens:
          type: integer
          minimum: 0
          description: Optional. Prompt cache write tokens (provider-specific).
          example: 0
        task_id:
          type: integer
          minimum: 1
          description: Optional. Factory task ID to attribute this usage to. Links cost to a specific task in the v_cost_by_task view.
          example: 1394

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # -------------------------------------------------------------------------
  # Health probe
  # -------------------------------------------------------------------------
  /health:
    get:
      operationId: getHealth
      summary: Infrastructure health probe
      description: |
        Checks DB connectivity and schema integrity. No authentication required.
        Safe to poll from external monitors and the dashboard health strip.

        Returns HTTP 200 when `status` is `ok`.
        Returns HTTP 503 when `status` is `degraded` (DB error or missing tables).

        Response shape confirmed by Silas — ARCH-019 Sprint 9 planning (2026-05-23).
        Implemented in `src/squad-api/routes/health.ts`.
      tags: [Health]
      responses:
        "200":
          description: All checks pass.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: squad-api
                db: connected
                schema: ok
        "503":
          description: DB unreachable or one or more required tables are missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                dbError:
                  summary: DB connection failed
                  value:
                    status: degraded
                    service: squad-api
                    db: error
                    schema: degraded
                    error: "Connection refused"
                schemaDegraded:
                  summary: Missing tables
                  value:
                    status: degraded
                    service: squad-api
                    db: connected
                    schema: degraded
                    missing_tables: [tasks, projects]

  # -------------------------------------------------------------------------
  # Agent roster
  # -------------------------------------------------------------------------
  /api/agents:
    get:
      operationId: getAgents
      summary: All provisioned agents
      description: |
        Returns all agents from the `agents` table, ordered active-first then
        by slug. Each row includes `active_task_count` — the number of tasks
        in `todo`, `wip`, `review`, or `rework` status assigned to that agent
        (LEFT JOIN — zero-task agents return 0, never null; SEC-C6).

        Token columns (`token_hash`, `token_salt`, all `previous_token_*`) are
        excluded from the response (SEC-A6).

        Queries via `openhiveos_reader` role (SEC-A5).
      tags: [Agents]
      security:
        - AgentBearer: []
      responses:
        "200":
          description: Agent roster returned.
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentRow"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/agents/{slug}:
    get:
      operationId: getAgentBySlug
      summary: Single agent — DB state composited with manifest role
      description: |
        Returns runtime state from the `agents` table composited with the
        static manifest role from `squad.manifest.json` (loaded once at startup,
        not per-request; SEC-C5).

        The `manifest` field is `null` when the slug is absent from the manifest
        (e.g. for agents provisioned after the manifest was last updated).

        Returns 404 when the slug is not found in the `agents` table. The error
        message does not reveal the existence of other slugs (SEC-C4).

        Token columns excluded (SEC-A6). Queries via `openhiveos_reader` (SEC-A5).
      tags: [Agents]
      security:
        - AgentBearer: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Agent slug (e.g. `murphy`).
      responses:
        "200":
          description: Agent found.
          content:
            application/json:
              schema:
                type: object
                required: [agent]
                properties:
                  agent:
                    $ref: "#/components/schemas/AgentDetail"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent slug not found in the `agents` table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # SOPs
  # -------------------------------------------------------------------------
  /api/sops:
    get:
      operationId: getSops
      summary: Paginated SOP roster
      description: |
        Returns a paginated list of SOPs from the `sops` table.

        The `embedding` vector column is never returned (SEC-B1 principle).
        The `instruction` field is truncated to a 200-character `preview` —
        the full instruction text is not exposed in list responses.

        `display_name` is derived server-side from the `source_path` basename
        with the `.md` extension stripped (no `title` column on the `sops` table).

        **Pagination** follows the ARCH-019 model:
        - `limit` integer [1, 100], default 25
        - `offset` integer ≥ 0, default 0
        - `has_more` true when a (limit+1)th row exists — no COUNT(*)

        **Category filter** (`category` query param) is validated against the
        `VALID_CATEGORIES` named const in the handler (SEC-C7 — auditability
        requires the allowlist to be a named constant, not an inline literal).
        An unrecognised value returns 400.
      tags: [SOPs]
      security:
        - AgentBearer: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [Coding, DevOps, QA, Architecture, Documentation, Decision]
          description: Filter by SOP category (SEC-C7 allowlist).
        - name: agent
          in: query
          required: false
          schema:
            type: string
          description: Filter by agent slug. Returns SOPs scoped to that agent only.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of rows to skip.
      responses:
        "200":
          description: SOP list returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SopsResponse"
              example:
                sops:
                  - id: 1
                    source_path: "/Users/richo/.copilot/agents/murphy/sops/git-deployment-workflow.md"
                    display_name: "git-deployment-workflow"
                    category: "Coding"
                    agent: "murphy"
                    preview: "Follow this workflow for all deployments..."
                    created_at: "2026-05-01T10:00:00.000Z"
                    updated_at: "2026-05-01T10:00:00.000Z"
                pagination:
                  limit: 25
                  offset: 0
                  has_more: false
        "400":
          description: Invalid query parameter (unknown category, limit out of range, negative offset).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # Tasks
  # -------------------------------------------------------------------------
  /api/tasks:
    get:
      operationId: getTasks
      summary: Paginated task roster
      description: |
        Returns a paginated list of tasks.

        Each row includes `project_slug` via a LEFT JOIN on `projects` — the
        dashboard InboxView uses this to link to the project without a second
        round-trip.

        **Pagination** follows the ARCH-019 model:
        - `limit` integer [1, 100], default 25
        - `offset` integer ≥ 0, default 0
        - `has_more` true when a (limit+1)th row exists — no COUNT(*)

        **Status filter** is validated against the `VALID_TASK_STATUSES` named
        const in the handler (SEC-C3). An unrecognised value returns 400.

        **Ordering:** `updated_at DESC, id DESC` — most recently touched tasks first.
      tags: [Tasks]
      security:
        - AgentBearer: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [todo, wip, review, done, rework]
          description: Filter by task status (SEC-C3 allowlist).
        - name: assignee
          in: query
          required: false
          schema:
            type: string
          description: Filter by assignee_agent_slug. Exact match.
        - name: project_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Filter to a single project by its primary key.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of rows to skip.
      responses:
        "200":
          description: Task list returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TasksResponse"
              example:
                tasks:
                  - id: 1
                    project_id: 1
                    project_slug: "openhiveos"
                    title: "Implement GET /api/tasks"
                    description: "Day 3 gate for InboxView"
                    status: "done"
                    assignee_agent_slug: "murphy"
                    github_pr_url: null
                    notes: null
                    created_at: "2026-05-23T07:00:00.000Z"
                    updated_at: "2026-05-23T09:00:00.000Z"
                pagination:
                  limit: 25
                  offset: 0
                  has_more: false
        "400":
          description: Invalid query parameter (unknown status, invalid project_id, limit/offset out of range).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # Thoughts
  # -------------------------------------------------------------------------
  /api/thoughts:
    get:
      operationId: getThoughts
      summary: Paginated thought roster
      description: |
        Returns a paginated list of agent thoughts.

        The following columns are intentionally excluded (SEC-B1, SEC-B3):
        `embedding`, `raw_behavior`, `expressed_behavior`, `disposition_snapshot`.

        **Pagination** follows the ARCH-019 model:
        - `limit` integer [1, 100], default 25
        - `offset` integer ≥ 0, default 0
        - `has_more` true when a (limit+1)th row exists — no COUNT(*)

        **thought_type filter** is validated against the `VALID_THOUGHT_TYPES`
        named const in the handler (SEC-C3). An unrecognised value returns 400.

        **Ordering:** `created_at DESC, id DESC` — most recent thoughts first.
      tags: [Thoughts]
      security:
        - AgentBearer: []
      parameters:
        - name: agent_slug
          in: query
          required: false
          schema:
            type: string
          description: Filter to thoughts recorded by this agent.
        - name: thought_type
          in: query
          required: false
          schema:
            type: string
            enum: [analysis, concern, decision, hypothesis, realization, pushback]
          description: Filter by thought type (SEC-C3 allowlist).
        - name: must_surface
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: Filter to surfaced (true) or non-surfaced (false) thoughts.
        - name: session_id
          in: query
          required: false
          schema:
            type: string
          description: Filter to a specific session.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Page size.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of rows to skip.
      responses:
        "200":
          description: Thought list returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThoughtsResponse"
              example:
                thoughts:
                  - id: 1
                    agent_slug: "murphy"
                    session_id: "murphy:session:1716451200000"
                    task_id: null
                    thought: "The partial index on sops.source_path requires ON CONFLICT to match the WHERE predicate."
                    thought_type: "realization"
                    confidence: 0.95
                    must_surface: false
                    auto_persist_candidate: true
                    ratified_by: null
                    ratified_at: null
                    auto_persisted: false
                    counter_thought: null
                    metadata: {}
                    created_at: "2026-05-23T09:00:00.000Z"
                pagination:
                  limit: 25
                  offset: 0
                  has_more: false
        "400":
          description: Invalid query parameter (unknown thought_type, invalid must_surface, limit/offset out of range).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # Ethos Seal
  # -------------------------------------------------------------------------
  /api/ethos-seal:
    get:
      operationId: getEthosSeal
      summary: Get the active Ethos Seal
      description: |
        Returns the active Ethos Seal record plus the last 10 deactivated (historical) versions.

        By default returns metadata only (version, signature, activated_at, activated_by).
        Pass `?include=payload` to also return the structured payload JSONB.

        The payload is the Squad's constitutional document — treat it with the same
        sensitivity as the Ethos Seal itself. It must not appear in application logs (SEC-B7).
      tags: [Ethos Seal]
      security:
        - AgentBearer: []
      parameters:
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum: ["payload"]
          description: Pass `payload` to include the full payload JSONB on the active seal.
      responses:
        "200":
          description: Active seal and history returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EthosSealResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: No active seal found (one-init has not been run), or database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # Usage — dashboard analytics
  # -------------------------------------------------------------------------
  /api/usage/agents:
    get:
      operationId: getAgentUsage
      summary: All agents — monthly cost aggregates
      description: |
        Returns monthly LLM cost aggregates for all agents in the Squad, for the
        last N months (default 6, max 24).

        Returns an empty `data` array when `llm_usage` has no rows (feature is dark
        until Bridge is deployed and connected). This is expected and not an error.

        Queries the `v_cost_by_agent_month` view via `openhiveos_reader` role (SEC-A5).
      tags: [Usage]
      security:
        - AgentBearer: []
      parameters:
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 6
          description: Number of calendar months to include. Clamped to [1, 24].
      responses:
        "200":
          description: Usage aggregates returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUsageResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/usage/agents/{name}:
    get:
      operationId: getAgentUsageDetail
      summary: Single agent — monthly cost detail
      description: |
        Returns monthly cost detail for a single agent, covering the last 12 months.
        Returns 404 if no usage data exists for the given agent slug.

        Queries the `v_cost_by_agent_month` view via `openhiveos_reader` role (SEC-A5).
      tags: [Usage]
      security:
        - AgentBearer: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Agent slug (e.g. `murphy`). Must not start with `-`.
      responses:
        "200":
          description: Per-agent monthly detail returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetailResponse"
        "400":
          description: Invalid agent name (empty or starts with `-`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No usage data found for the given agent slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/usage/tasks/{id}:
    get:
      operationId: getTaskCost
      summary: Task cost breakdown
      description: |
        Returns lifetime cost attribution for a single Factory task.
        Returns 404 if the task has no usage records in `llm_usage`.

        Queries the `v_cost_by_task` view via `openhiveos_reader` role (SEC-A5).
      tags: [Usage]
      security:
        - AgentBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: Numeric task ID.
      responses:
        "200":
          description: Task cost breakdown returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCostRow"
        "400":
          description: Task ID is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No usage data found for the given task ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # Internal — ingestion (Bridge → squad-api)
  # -------------------------------------------------------------------------
  /internal/usage:
    post:
      operationId: ingestUsage
      summary: Ingest LLM usage record from Bridge
      description: |
        Accepts a single LLM token and cost record from Bridge and stores it in
        `llm_usage`. Called once per LLM request loop in a Bridge session.

        **Auth:** `OPENHIVEOS_INGESTION_TOKEN` — a shared 64-char hex secret separate
        from the agent bearer token system. See docs/08-agent-onboarding.md §6 for
        the rotation procedure (SEC-C10).

        **Idempotency:** A duplicate `(session_id, loop_index)` pair returns 409.
        This is the expected behaviour for Bridge retries — not a security incident (SEC-C6).

        **Rate limit:** 60 requests per minute per IP (SEC-C3).

        **Unknown fields:** Rejected with 400 (SEC-C4 strict mode — `additionalProperties: false`).
      tags: [Ingestion]
      security:
        - IngestionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageIngestionPayload"
      responses:
        "201":
          description: Usage record stored successfully.
        "400":
          description: Payload validation failed — missing required field, wrong type, unknown field, or malformed session_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid `OPENHIVEOS_INGESTION_TOKEN`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate `(session_id, loop_index)` — record already exists. Bridge should not retry this record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: |
            `cost_usd` is missing or null. Cost must be supplied by Bridge —
            server-side pricing computation is not supported (SEC-C9).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded (60 req/min). Bridge should back off and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

# ---------------------------------------------------------------------------
# Tags (display grouping)
# ---------------------------------------------------------------------------
tags:
  - name: Health
    description: Infrastructure health probe. No auth. Safe to poll from external monitors and dashboard health strip.
  - name: Agents
    description: Agent roster — runtime state from the DB composited with static manifest roles.
  - name: SOPs
    description: SOP roster — paginated, category-filtered. embedding excluded; instruction truncated to 200-char preview.
  - name: Tasks
    description: Task roster — paginated, filterable by status/assignee/project. project_slug denormalized from JOIN.
  - name: Thoughts
    description: Thought roster — paginated, filterable by agent/type/must_surface/session. embedding + behaviour columns excluded (SEC-B1, SEC-B3).
  - name: Ethos Seal
    description: Squad constitutional document — versioned, HMAC-signed, boot-verified.
  - name: Usage
    description: LLM cost analytics for the operator dashboard.
  - name: Ingestion
    description: Internal endpoint for Bridge to POST usage records. Not for browser clients.
